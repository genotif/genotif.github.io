<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Virtual Biologi</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    
    <style>
        /* Custom Animation for Background */
        @keyframes blob {
          0% { transform: translate(0px, 0px) scale(1); }
          33% { transform: translate(30px, -50px) scale(1.1); }
          66% { transform: translate(-20px, 20px) scale(0.9); }
          100% { transform: translate(0px, 0px) scale(1); }
        }
        @keyframes bubble {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-150px) scale(1.5); opacity: 0; }
        }
        @keyframes drip {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            50% { transform: translateY(40px) scale(0.8); opacity: 1; }
            100% { transform: translateY(80px) scale(0); opacity: 0; }
        }
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
        .animate-drip { animation: drip 1.5s infinite ease-in; }
        
        .cursor-wait { cursor: wait; }
        
        /* Loading Screen */
        #loading {
            position: fixed; inset: 0; background: #f8fafc; z-index: 50;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: sans-serif; color: #475569;
        }
        /* Error Box */
        #error-box {
            display: none; position: fixed; top: 0; left: 0; width: 100%; 
            background: #ef4444; color: white; padding: 1rem; text-align: center; z-index: 100;
            font-family: sans-serif;
        }

        /* 3D Utilities */
        .btn-3d {
            transition: all 0.15s ease;
        }
        .btn-3d:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 0px 0 0 transparent, 0 2px 5px rgba(0,0,0,0.2) !important;
        }
        .glass-3d {
            box-shadow: inset 15px 0 25px rgba(0,0,0,0.15), inset -15px 0 25px rgba(255,255,255,0.6), 0 25px 35px rgba(0,0,0,0.2);
        }
        .liquid-3d {
            box-shadow: inset 10px 0 20px rgba(0,0,0,0.3), inset -10px 0 20px rgba(255,255,255,0.3);
        }
    </style>
</head>
<body class="bg-slate-50 select-none"> <div id="error-box"></div>
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const errorBox = document.getElementById('error-box');
            errorBox.style.display = 'block';
            errorBox.innerHTML = `<strong>Error:</strong> ${message} <br><small>Line: ${lineno}</small>`;
            const loading = document.getElementById('loading');
            if(loading) loading.style.display = 'none';
        };
    </script>

    <div id="loading">
        <div style="width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #10b981; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="margin-top: 1rem; font-weight: bold;">Memuat Laboratorium 3D...</p>
        <p style="font-size: 0.8rem; opacity: 0.7;">Sedang menyiapkan aset grafis</p>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- SYNTHETIC SOUND GENERATOR (OFFLINE FRIENDLY) ---
        const SoundGenerator = {
            ctx: null,
            isMuted: false,
            init: function() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playTone: function(freq, type, duration, vol=0.1) {
                if(this.isMuted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },
            playClick: function() {
                this.playTone(800, 'sine', 0.05, 0.02);
            },
            playDrop: function() {
                if(this.isMuted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            },
            playSuccess: function() {
                if(this.isMuted) return;
                this.playTone(523.25, 'sine', 0.1, 0.03); // C5
                setTimeout(() => this.playTone(659.25, 'sine', 0.1, 0.03), 100); // E5
                setTimeout(() => this.playTone(783.99, 'sine', 0.3, 0.03), 200); // G5
            },
            playError: function() {
                if(this.isMuted) return;
                this.playTone(200, 'sawtooth', 0.2, 0.03);
                setTimeout(() => this.playTone(150, 'sawtooth', 0.3, 0.03), 150);
            },
            playHeat: function() {
                if(this.isMuted) return;
                let count = 0;
                const interval = setInterval(() => {
                    this.playDrop();
                    count++;
                    if(count > 12) clearInterval(interval);
                }, 150);
            }
        };

        // --- ICONS ---
        const Icon = ({ children, className, size = 24, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>{children}</svg>
        );
        const Flame = (props) => <Icon {...props}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.1.2-2.2.5-3.3.3-1.1.8-2.1 1.5-3.2"/></Icon>;
        const Droplets = (props) => <Icon {...props}><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.35"/></Icon>;
        const RotateCcw = (props) => <Icon {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></Icon>;
        const BookOpen = (props) => <Icon {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></Icon>;
        const CheckCircle = (props) => <Icon {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></Icon>;
        const XCircle = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></Icon>;
        const User = (props) => <Icon {...props}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Icon>;
        const Save = (props) => <Icon {...props}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></Icon>;
        const ClipboardList = (props) => <Icon {...props}><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></Icon>;
        const FileText = (props) => <Icon {...props}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></Icon>;
        const MessageCircle = (props) => <Icon {...props}><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></Icon>;
        const Leaf = (props) => <Icon {...props}><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></Icon>;
        const Dna = (props) => <Icon {...props}><path d="M2 15c6.667-6 13.333 0 20-6"/><path d="M9 22c1.798-1.998 2.518-3.995 2.807-5.993"/><path d="M15 2c-1.798 1.998-2.518 3.995-2.807 5.993"/><path d="M17 12a5.73 5.73 0 0 0 4 0"/><path d="M3 12a5.73 5.73 0 0 0 4 0"/></Icon>;
        const Activity = (props) => <Icon {...props}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></Icon>;
        const ArrowRight = (props) => <Icon {...props}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></Icon>;
        const RefreshCw = (props) => <Icon {...props}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></Icon>;
        const Send = (props) => <Icon {...props}><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></Icon>;
        const Link = (props) => <Icon {...props}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></Icon>;
        const Volume2 = (props) => <Icon {...props}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></Icon>;
        const VolumeX = (props) => <Icon {...props}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></Icon>;
        const Package = (props) => <Icon {...props}><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></Icon>;
        const School = (props) => <Icon {...props}><path d="M14 22v-4a2 2 0 1 0-4 0v4"/><path d="m18 10 4 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8l4-2"/><path d="M18 5v17"/><path d="m4 6 8-4 8 4"/><path d="M6 5v17"/><circle cx="12" cy="9" r="2"/></Icon>;

        // Komponen Pintar untuk Gambar Sampel (Fallback ke Emoji jika gambar rusak)
        const FoodIcon = ({ food }) => {
            const [hasError, setHasError] = React.useState(false);
            if (food.image && !hasError) {
                return (
                    <img 
                        src={food.image} 
                        alt={food.name} 
                        onError={() => setHasError(true)} 
                        className="w-12 h-12 object-cover rounded-full relative z-10 drop-shadow-md transform hover:scale-110 transition-transform" 
                    />
                );
            }
            return <span className="text-4xl relative z-10 drop-shadow-md transform hover:scale-110 transition-transform">{food.icon}</span>;
        };

        // --- DATA REFERENSI ---
        const REAGENTS = [
            { id: 'lugol', name: 'Lugol (Iodine)', target: 'Amilum', baseColor: 'bg-amber-600', positiveColor: 'bg-slate-900', negativeColor: 'bg-amber-600', desc: 'Indikator Amilum (Karbohidrat).', requiresHeat: false },
            { id: 'biuret', name: 'Biuret', target: 'Protein', baseColor: 'bg-blue-400', positiveColor: 'bg-purple-600', negativeColor: 'bg-blue-400', desc: 'Indikator Protein (Ikatan Peptida).', requiresHeat: false },
            { id: 'benedict', name: 'Benedict', target: 'Glukosa', baseColor: 'bg-cyan-400', positiveColor: 'bg-red-600', negativeColor: 'bg-cyan-400', desc: 'Indikator Glukosa (Gula Pereduksi). Butuh pemanasan.', requiresHeat: true },
            { id: 'ethanol', name: 'Etanol / Kertas', target: 'Lemak', baseColor: 'bg-white/40', positiveColor: 'bg-yellow-100/60', negativeColor: 'bg-white', desc: 'Indikator Lemak (Transparansi/Emulsi).', requiresHeat: false, isPaperTest: true }
        ];

        const FOODS = [
            // PERHATIKAN: Kandungan glukosa pada Nasi diubah menjadi false by default. Akan true jika dikunyah.
            { id: 'nasi', name: 'Larutan Nasi', icon: '🍚', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQk8zPe6clERPejiTAEEMFQaWd3SxR5kkz1vJt0i6kDaSz6icxSBgo0hm_wagSiqwyV0daw29jX1EgPtRNIcCn2HQFml9hrl7WzTVVZxxj5nQ&s=10', contents: { amilum: true, protein: false, glukosa: false, lemak: false }, baseColor: 'bg-slate-200' },
            { id: 'telur', name: 'Putih Telur', icon: '🥚', image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Egg_white.jpg/200px-Egg_white.jpg', contents: { amilum: false, protein: true, glukosa: false, lemak: false }, baseColor: 'bg-yellow-50' },
            { id: 'susu', name: 'Susu', icon: '🥛', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRgz5KgI-lTATlVZFdjtO_3kG_ENgjt64aHSw&s', contents: { amilum: false, protein: true, glukosa: true, lemak: true }, baseColor: 'bg-white' },
            { id: 'minyak', name: 'Minyak Goreng', icon: '🌻', image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Bottle_of_sunflower_oil.jpg/200px-Bottle_of_sunflower_oil.jpg', contents: { amilum: false, protein: false, glukosa: false, lemak: true }, baseColor: 'bg-yellow-300' },
            { id: 'tahu', name: 'Ekstrak Tahu', icon: '🧊', image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Tofu_01.jpg/200px-Tofu_01.jpg', contents: { amilum: false, protein: true, glukosa: false, lemak: false }, baseColor: 'bg-stone-200' },
            { id: 'jeruk', name: 'Air Jeruk', icon: '🍊', image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Orange_Juice_Glass.jpg/200px-Orange_Juice_Glass.jpg', contents: { amilum: false, protein: false, glukosa: true, lemak: false }, baseColor: 'bg-orange-200' }
        ];

        // --- DATA PERSIAPAN ALAT & BAHAN ---
        const PREP_DATA = [
            { id: 'tabung', label: 'Tabung Reaksi & Rak', isCorrect: true, icon: '🧪' },
            { id: 'pipet', label: 'Pipet Tetes', isCorrect: true, icon: '💧' },
            { id: 'mikroskop', label: 'Mikroskop', isCorrect: false, icon: '🔬' },
            { id: 'bunsen', label: 'Pembakar Bunsen', isCorrect: true, icon: '🔥' },
            { id: 'timbangan', label: 'Timbangan Digital', isCorrect: false, icon: '⚖️' },
            { id: 'reagen', label: 'Reagen Uji', isCorrect: true, icon: '🧪' },
            { id: 'plat', label: 'Plat Tetes / Kertas', isCorrect: true, icon: '🧫' },
            { id: 'skalpel', label: 'Pisau Bedah', isCorrect: false, icon: '🔪' },
            { id: 'sampel', label: 'Sampel Makanan', isCorrect: true, icon: '🍱' },
        ];

        const CONCLUSION_OPTIONS = [
            { id: 'Amilum', label: 'Mengandung Amilum' },
            { id: 'Protein', label: 'Mengandung Protein' },
            { id: 'Glukosa', label: 'Mengandung Glukosa' },
            { id: 'Lemak', label: 'Mengandung Lemak' },
            { id: 'Netral', label: 'Netral / Tidak Mengandung Zat Diuji' }
        ];

        const GOOGLE_SCRIPT_URL_DEFAULT = "https://script.google.com/macros/s/AKfycbywOd2mVCueRqsigD-jgyaAOLOzm4r1ZWAb1tUnVBv-BobMeikJ7fpOGmfupvk5GDQS/exec"; 
        const MAX_ATTEMPTS = 5; 

        function VirtualFoodLab() {
            const [userData, setUserData] = useState({ name: '', className: '', isLoggedIn: false });
            const [tempName, setTempName] = useState('');
            const [tempClass, setTempClass] = useState('');
            const [attemptCount, setAttemptCount] = useState(0); 
            
            const [scriptUrl, setScriptUrl] = useState(GOOGLE_SCRIPT_URL_DEFAULT);
            const [showConfig, setShowConfig] = useState(false);

            const [selectedFood, setSelectedFood] = useState(null);
            const [selectedReagent, setSelectedReagent] = useState(null);
            const [isReacting, setIsReacting] = useState(false);
            
            const [visualResult, setVisualResult] = useState(null); 
            const [heatApplied, setHeatApplied] = useState(false);
            const [showConclusionModal, setShowConclusionModal] = useState(false);
            const [finalLog, setFinalLog] = useState([]); 
            const [showTheory, setShowTheory] = useState(false);
            const [showLKPD, setShowLKPD] = useState(false);
            const [completedFoods, setCompletedFoods] = useState([]); 
            const [isSending, setIsSending] = useState(false);
            const [hasSubmittedCurrentSession, setHasSubmittedCurrentSession] = useState(false); 
            const [isDragOver, setIsDragOver] = useState(false);
            
            // State untuk mengunyah Nasi
            const [isChewed, setIsChewed] = useState(false);

            // State Persiapan Alat Bahan
            const [showPrep, setShowPrep] = useState(false);
            const [prepItems, setPrepItems] = useState([]);
            const [prepDragOver, setPrepDragOver] = useState(false);
            const [prepError, setPrepError] = useState(null);
            const prepTimeoutRef = useRef(null);

            // State Diskusi
            const [showDiscussion, setShowDiscussion] = useState(false);
            const [discussionAnswers, setDiscussionAnswers] = useState({
                q1: '', q2: '', q3: '', q4: ''
            });

            const DISCUSSION_QUESTIONS = [
                { id: 'q1', text: 'Berdasarkan hasil pengujian, bahan makanan apa saja yang mengandung karbohidrat (amilum) dan glukosa?' },
                { id: 'q2', text: 'Mengapa uji glukosa menggunakan reagen Benedict selalu memerlukan pemanasan?' },
                { id: 'q3', text: 'Bahan makanan manakah yang terbukti merupakan sumber protein?' },
                { id: 'q4', text: 'Apa yang terjadi pada kertas uji ketika ditetesi dengan ekstrak bahan yang mengandung lemak?' }
            ];

            // State Audio
            const [isMuted, setIsMuted] = useState(false);

            const toggleMute = () => {
                SoundGenerator.isMuted = !isMuted;
                setIsMuted(!isMuted);
                if(isMuted) {
                    setTimeout(() => SoundGenerator.playClick(), 50);
                }
            };

            // --- DRAG AND DROP LAB ---
            const handleDragStart = (e, type, item) => {
                SoundGenerator.playClick();
                e.dataTransfer.setData('itemType', type);
                e.dataTransfer.setData('itemId', item.id);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragOver(false);
                const type = e.dataTransfer.getData('itemType');
                const id = e.dataTransfer.getData('itemId');

                if (type === 'food') {
                    const food = FOODS.find(f => f.id === id);
                    if (food) {
                        SoundGenerator.playDrop();
                        setSelectedFood(food);
                        setSelectedReagent(null);
                        setVisualResult(null);
                        setHeatApplied(false);
                        setIsChewed(false); // Reset status kunyah
                    }
                } else if (type === 'reagent') {
                    if (!selectedFood) {
                        SoundGenerator.playError();
                        alert("Tarik sampel makanan terlebih dahulu ke dalam tabung!");
                        return;
                    }
                    const reagent = REAGENTS.find(r => r.id === id);
                    if (reagent) {
                        SoundGenerator.playDrop();
                        setSelectedReagent(reagent);
                        setVisualResult(null);
                        setHeatApplied(false);
                    }
                }
            };

            // --- DRAG AND DROP PERSIAPAN ALAT (PREP) ---
            const handlePrepDragStart = (e, item) => {
                SoundGenerator.playClick();
                e.dataTransfer.setData('prepId', item.id);
            };

            const handlePrepDrop = (e) => {
                e.preventDefault();
                setPrepDragOver(false);
                const id = e.dataTransfer.getData('prepId');
                if (!id) return;
                
                const item = PREP_DATA.find(p => p.id === id);
                if (item) {
                    if (item.isCorrect) {
                        if (!prepItems.includes(id)) {
                            setPrepItems([...prepItems, id]);
                            SoundGenerator.playSuccess();
                            setPrepError(null);
                        }
                    } else {
                        SoundGenerator.playError();
                        setPrepError(`Tetot! ${item.label} tidak diperlukan untuk praktikum ini.`);
                        if (prepTimeoutRef.current) clearTimeout(prepTimeoutRef.current);
                        prepTimeoutRef.current = setTimeout(() => setPrepError(null), 3000);
                    }
                }
            };

            const getUserKey = (name, className) => `lab_attempts_${name.trim().toLowerCase()}_${className.trim().toLowerCase()}`;

            const handleLogin = (e) => {
                e.preventDefault();
                if (tempName && tempClass) {
                    const userKey = getUserKey(tempName, tempClass);
                    const savedAttempts = parseInt(localStorage.getItem(userKey) || '0', 10);

                    if (savedAttempts >= MAX_ATTEMPTS) {
                        alert(`Mohon maaf, ${tempName}.\n\nAnda sudah mencapai batas maksimal ${MAX_ATTEMPTS}x percobaan.\nAnda tidak dapat login lagi.`);
                        return;
                    }

                    // Init audio context on user gesture
                    SoundGenerator.init();
                    SoundGenerator.playSuccess();

                    setAttemptCount(savedAttempts);
                    setUserData({ name: tempName, className: tempClass, isLoggedIn: true });
                }

                SoundGenerator.playClick();
                setSelectedFood(null);
                setSelectedReagent(null);
                setVisualResult(null);
                setHeatApplied(false);
                setIsChewed(false);
                setShowConclusionModal(false);
            };

            const resetAll = () => {
                if (attemptCount >= MAX_ATTEMPTS) {
                    SoundGenerator.playError();
                    alert("Anda sudah mencapai batas maksimal percobaan. Tidak bisa reset.");
                    return;
                }
                if(window.confirm("Apakah anda yakin ingin menghapus semua data hasil praktikum dan mulai dari awal?")) {
                    SoundGenerator.playClick();
                    setFinalLog([]);
                    setCompletedFoods([]);
                    setHasSubmittedCurrentSession(false); 
                    resetLab();
                }
            };

            const handleTest = () => {
                if (!selectedFood || !selectedReagent) return;
                SoundGenerator.playDrop();
                setIsReacting(true);
                setTimeout(() => {
                    calculateVisualResult(false);
                    setIsReacting(false);
                }, 2000); 
            };

            const handleHeat = () => {
                SoundGenerator.playHeat();
                setHeatApplied(true);
                setIsReacting(true);
                setTimeout(() => {
                    calculateVisualResult(true);
                    setIsReacting(false);
                }, 2000);
            };

            const calculateVisualResult = (isHeated) => {
                let colorClass = selectedReagent.negativeColor;
                let isPositive = false;
                let pendingHeat = false;
                let isPrecipitate = false; 

                if (selectedReagent.id === 'lugol') {
                    if (selectedFood.contents.amilum) isPositive = true;
                } else if (selectedReagent.id === 'biuret') {
                    if (selectedFood.contents.protein) isPositive = true;
                } else if (selectedReagent.id === 'benedict') {
                    // Logika khusus Nasi
                    if (selectedFood.id === 'nasi') {
                        if (isHeated) {
                            if (isChewed) {
                                isPositive = true;
                                isPrecipitate = true;
                            } else {
                                isPositive = false; // Tetap negatif jika tidak dikunyah
                            }
                        } else {
                            pendingHeat = true;
                        }
                    } else if (selectedFood.contents.glukosa) {
                        if (isHeated) isPositive = true;
                        else pendingHeat = true;
                    } else {
                        if (!isHeated) pendingHeat = true;
                    }
                } else if (selectedReagent.id === 'ethanol') {
                    if (selectedFood.contents.lemak) isPositive = true;
                }

                if (isPositive) colorClass = selectedReagent.positiveColor;

                setVisualResult({ isPositive, colorClass, pendingHeat, isPrecipitate });
                if (!pendingHeat) {
                    SoundGenerator.playClick();
                    setTimeout(() => setShowConclusionModal(true), 600);
                } else {
                    SoundGenerator.playError(); // Indicate it needs heat
                }
            };

            const handleConclusionSubmit = (conclusionId) => {
                let isCorrectConclusion = false;
                if (visualResult.isPositive) {
                    if (conclusionId === selectedReagent.target) isCorrectConclusion = true;
                } else {
                    if (conclusionId === 'Netral') isCorrectConclusion = true;
                }

                if (isCorrectConclusion) SoundGenerator.playSuccess();
                else SoundGenerator.playError();

                const logFoodName = isChewed ? `${selectedFood.name} (Dikunyah)` : selectedFood.name;

                const newLog = {
                    timestamp: new Date().toLocaleTimeString(),
                    food: logFoodName,
                    reagent: selectedReagent.name,
                    visualResult: visualResult.isPositive ? (visualResult.isPrecipitate ? 'Endapan (+)' : 'Berubah Warna (+)') : 'Tidak Berubah (-)',
                    userConclusion: conclusionId,
                    isCorrect: isCorrectConclusion
                };

                setFinalLog([newLog, ...finalLog]);
                if (!completedFoods.includes(selectedFood.id)) setCompletedFoods([...completedFoods, selectedFood.id]);
                setShowConclusionModal(false);
            };

            const handleFinishAndSend = async () => {
                SoundGenerator.playClick();
                if (!scriptUrl) {
                    alert("Mohon masukkan URL Google Apps Script terlebih dahulu.");
                    return;
                }

                setIsSending(true);
                const totalCorrect = finalLog.filter(l => l.isCorrect).length;
                const totalWrong = finalLog.length - totalCorrect;
                
                const summaryData = [{
                    Waktu: new Date().toLocaleString(),
                    Nama: userData.name,
                    Kelas: userData.className,
                    Total_Benar: totalCorrect,
                    Total_Salah: totalWrong
                }];

                try {
                    await fetch(scriptUrl, {
                        method: 'POST',
                        body: JSON.stringify(summaryData),
                        mode: "no-cors",
                        headers: { "Content-Type": "text/plain" }
                    });

                    const newAttemptCount = attemptCount + 1;
                    setAttemptCount(newAttemptCount);
                    const userKey = getUserKey(userData.name, userData.className);

                    SoundGenerator.playSuccess();

                                        {/* 3D Tabung Reaksi (Test Tube) */}
                                        <div className="w-36 h-56 rounded-b-[4rem] relative overflow-hidden glass-3d bg-white/10 backdrop-blur-md border-x-2 border-b-4 border-white/50 z-10 flex flex-col justify-end">
                                            
                                            <div className="absolute top-0 left-2 w-4 h-[95%] bg-gradient-to-b from-white/90 to-transparent rounded-full blur-[2px] z-30 pointer-events-none"></div>
                                            <div className="absolute top-0 right-1 w-6 h-[95%] bg-black/10 rounded-full blur-[3px] z-30 pointer-events-none"></div>

                                            <div className={`relative w-full transition-all duration-1000 ease-in-out z-20 liquid-3d
                                                    ${selectedFood ? 'h-[65%]' : 'h-0'}
                                                    ${visualResult && !visualResult.isPrecipitate ? visualResult.colorClass : (visualResult?.isPrecipitate ? 'bg-sky-500' : (selectedFood?.baseColor || 'bg-transparent'))}
                                                `}
                                            >
                                                {selectedFood && (
                                                    <div className={`absolute top-0 left-0 w-full h-6 -mt-3 rounded-[50%] brightness-110 shadow-[inset_0_-2px_4px_rgba(0,0,0,0.2),inset_0_2px_4px_rgba(255,255,255,0.5)] border-b border-black/10
                                                        ${visualResult && !visualResult.isPrecipitate ? visualResult.colorClass : (visualResult?.isPrecipitate ? 'bg-sky-500' : selectedFood.baseColor)}
                                                    `}></div>
                                                )}

                                                {/* Animasi Endapan Khusus */}
                                                {visualResult?.isPrecipitate && (
                                                    <div className={`absolute bottom-0 left-0 w-full h-[35%] rounded-b-[4rem] ${visualResult.colorClass} opacity-95 transition-all duration-1000 delay-500 overflow-hidden shadow-[inset_0_4px_10px_rgba(0,0,0,0.3)]`}>
                                                        {/* Tekstur kasar/berbutir pada endapan */}
                                                        <div className="absolute inset-0 opacity-50 mix-blend-multiply" style={{backgroundImage: 'radial-gradient(circle, #450a0a 1.5px, transparent 1.6px)', backgroundSize: '6px 6px'}}></div>
                                                        <div className="absolute inset-0 opacity-40 mix-blend-multiply" style={{backgroundImage: 'radial-gradient(circle, #000000 1px, transparent 1.2px)', backgroundSize: '4px 4px', backgroundPosition: '2px 2px'}}></div>
                                                        
                                                        <div className="absolute top-0 left-0 w-full h-2 rounded-[50%] bg-white/30 backdrop-blur-sm border-b border-black/20"></div>
                                                    </div>
                                                )}

                                                {(heatApplied || visualResult?.isPositive) && (
                                                    <div className="absolute inset-0 opacity-70">
                                                        {Array.from({length: 6}).map((_, i) => (
                                                            <div key={i} className="absolute bg-white/80 rounded-full animate-bubble shadow-sm" 
                                                                style={{
                                                                    width: Math.random() * 12 + 6 + 'px',
                                                                    height: Math.random() * 12 + 6 + 'px',
                                                                    left: Math.random() * 80 + 10 + '%',
                                                                    bottom: '-15px',
                                                                    animationDuration: Math.random() * 1.5 + 1 + 's',
                                                                    animationDelay: Math.random() + 's'
                                                                }}>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                        
                                        {/* Label Wadah */}
                                        <div className={`bg-slate-800 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-[0_5px_15px_rgba(0,0,0,0.3),inset_0_2px_2px_rgba(255,255,255,0.2)] border border-slate-700 z-30 transition-all duration-500 
                                            ${selectedReagent?.id === 'benedict' 
                                                ? 'absolute bottom-24 translate-x-[8rem] md:translate-x-[9rem] whitespace-nowrap' 
                                                : 'mt-8 relative translate-x-0'
                                            }
                                        `}>
                                            {logFoodName || 'Wadah Kosong'}
                                        </div>
                                    </div>
                                </div>

                                {/* Action Bar Bawah Lab */}
                                <div className="bg-white p-6 flex flex-col md:flex-row items-center justify-between gap-6 relative z-20 rounded-b-3xl">
                                    <div className="flex-1 text-sm w-full">
                                        {!selectedFood ? (
                                            <div className="flex items-center gap-3 text-slate-500 bg-slate-50 p-3 rounded-xl border border-slate-200">
                                                <div className="bg-slate-200 p-2 rounded-full animate-pulse"><ArrowRight size={18}/></div>
                                                <span>Silakan tarik (drag) atau klik <b>Sampel Makanan</b> ke tabung.</span>
                                            </div>
                                        ) : !selectedReagent ? (
                                            <div className="flex flex-col gap-2">
                                                <div className="flex items-center gap-3 text-slate-500 bg-slate-50 p-3 rounded-xl border border-slate-200">
                                                    <div className="bg-slate-200 p-2 rounded-full animate-pulse"><ArrowRight size={18}/></div>
                                                    <span>Sekarang tarik (drag) atau klik <b>Reagen</b> penguji ke tabung.</span>
                                                </div>
                                                {selectedFood.id === 'nasi' && !isChewed && (
                                                    <div className="flex items-center gap-3 text-pink-700 bg-pink-50 p-3 rounded-xl border border-pink-200 font-bold shadow-sm">
                                                        <span>💡 Info Biologi: Nasi mentah/tumbuk hanya mengandung amilum. Nasi perlu dikunyah agar enzim amilase (ptialin) memecahnya menjadi glukosa.</span>
                                                    </div>
                                                )}
                                            </div>
                                        ) : visualResult?.pendingHeat ? (
                                            <div className="flex items-center gap-3 text-red-700 bg-red-50 p-3 rounded-xl border border-red-200 font-bold shadow-sm">
                                                <div className="bg-red-200 p-2 rounded-full"><Flame size={18} className="animate-bounce" /></div>
                                                <span>Reagen ini butuh pemanasan! Klik tombol Panaskan.</span>
                                            </div>
                                        ) : finalLog.length > 0 && finalLog[0].food === logFoodName && finalLog[0].reagent === selectedReagent.name ? (
                                            <div className="flex items-center gap-3 bg-emerald-50 p-3 rounded-xl border border-emerald-200">
                                                <div className="bg-emerald-200 p-2 rounded-full text-emerald-700"><Save size={18} /></div>
                                                <div>
                                                    <div className="font-bold text-emerald-800">Data Tersimpan</div>
                                                    <div className="text-xs text-emerald-600">Klik "Lanjut" untuk sampel berikutnya.</div>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="text-slate-600 font-medium p-3">
                                                Alat siap. Klik tombol aksi di kanan.
                                            </div>
                                        )}
                                    </div>

                                    <div className="flex items-center gap-3 shrink-0 w-full md:w-auto">
                                        {(finalLog.length > 0 && finalLog[0].food === logFoodName && finalLog[0].reagent === selectedReagent?.name) ? (
                                            <button onClick={resetLab} className="btn-3d flex-1 md:flex-none flex justify-center items-center gap-2 px-8 py-4 bg-emerald-500 text-white rounded-2xl font-bold shadow-[0_6px_0_#059669,0_10px_15px_rgba(0,0,0,0.1)] text-lg">
                                                Lanjut <ArrowRight size={20} />
                                            </button>
                                        ) : (
                                            <React.Fragment>
                                                {selectedFood?.id === 'nasi' && !isChewed && !visualResult && (
                                                    <button
                                                        onClick={() => { SoundGenerator.playDrop(); setIsChewed(true); }}
                                                        disabled={isReacting}
                                                        className="btn-3d flex-1 md:flex-none flex justify-center items-center gap-2 px-4 py-4 bg-pink-500 hover:bg-pink-600 text-white rounded-2xl font-bold shadow-[0_6px_0_#be185d,0_10px_15px_rgba(0,0,0,0.1)] transition-all disabled:opacity-50"
                                                    >
                                                        <Activity size={20} /> Kunyah Nasi
                                                    </button>
                                                )}

                                                {selectedReagent?.requiresHeat && (
                                                <button
                                                    onClick={handleHeat}
                                                    disabled={!visualResult?.pendingHeat || isReacting}
                                                    className={`btn-3d flex-1 md:flex-none flex justify-center items-center gap-2 px-6 py-4 rounded-2xl font-bold transition-all
                                                    ${!visualResult?.pendingHeat 
                                                        ? 'bg-slate-100 text-slate-400 cursor-not-allowed shadow-[0_4px_0_#cbd5e1]' 
                                                        : 'bg-orange-500 text-white shadow-[0_6px_0_#ea580c,0_10px_15px_rgba(0,0,0,0.1)]'
                                                    }`}
                                                >
                                                    <Flame size={20} fill="currentColor" /> Panaskan
                                                </button>
                                                )}

                                                <button
                                                    onClick={handleTest}
                                                    disabled={!selectedFood || !selectedReagent || isReacting || visualResult}
                                                    className="btn-3d flex-1 md:flex-none flex justify-center items-center gap-2 px-6 py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-[0_6px_0_#2563eb,0_10px_15px_rgba(0,0,0,0.1)] transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-[0_6px_0_#94a3b8]"
                                                >
                                                    <Droplets size={20} fill="currentColor" /> Teteskan Reagen
                                                </button>
                                            </React.Fragment>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Bottom Section: Result Log */}
                        <div className="lg:col-span-12 mt-4 animate-in fade-in slide-in-from-bottom-10 delay-100 pb-10">
                            <div className="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
                                <div className="bg-gradient-to-r from-emerald-50 to-teal-50 px-8 py-5 border-b border-emerald-100 flex flex-col md:flex-row justify-between items-center gap-4">
                                    <div className="flex items-center gap-3 text-emerald-900 font-black text-lg">
                                        <div className="bg-emerald-200 p-2 rounded-lg text-emerald-700"><ClipboardList size={24} /></div>
                                        Laporan Praktikum
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <div className="flex items-center gap-1 text-xs font-bold text-emerald-700 bg-white px-3 py-1.5 rounded-lg shadow-sm border border-emerald-100">
                                            <Save size={14} /> Tersimpan
                                        </div>
                                    </div>
                                </div>
                                <div className="overflow-x-auto p-4">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-slate-100 text-slate-600 uppercase text-xs font-black rounded-lg">
                                            <tr>
                                                <th className="px-6 py-4 rounded-tl-lg">Bahan Makanan</th>
                                                <th className="px-6 py-4">Reagen</th>
                                                <th className="px-6 py-4">Perubahan Warna</th>
                                                <th className="px-6 py-4">Kesimpulan Siswa</th>
                                                <th className="px-6 py-4 rounded-tr-lg">Status Analisis</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {finalLog.length === 0 ? (
                                                <tr>
                                                    <td colSpan="5" className="px-6 py-16 text-center">
                                                        <div className="flex flex-col items-center justify-center text-slate-400">
                                                            <ClipboardList size={64} className="mb-4 opacity-20" />
                                                            <p className="italic font-medium">Belum ada data praktikum.</p>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ) : (
                                                finalLog.map((log, index) => (
                                                    <tr key={index} className="hover:bg-slate-50 transition-colors">
                                                        <td className="px-6 py-4 font-bold text-slate-800">{log.food}</td>
                                                        <td className="px-6 py-4 font-medium text-slate-600">{log.reagent}</td>
                                                        <td className="px-6 py-4 text-slate-600">{log.visualResult}</td>
                                                        <td className="px-6 py-4">
                                                            <span className="bg-indigo-50 text-indigo-700 px-4 py-1.5 rounded-lg text-xs font-bold border border-indigo-200">
                                                                {log.userConclusion}
                                                            </span>
                                                        </td>
                                                        <td className="px-6 py-4">
                                                            {log.isCorrect ? (
                                                                <span className="flex items-center gap-1.5 text-emerald-700 font-bold text-xs bg-emerald-100 w-fit px-4 py-1.5 rounded-lg border border-emerald-200 shadow-sm">
                                                                    <CheckCircle size={16} /> Benar
                                                                </span>
                                                            ) : (
                                                                <span className="flex items-center gap-1.5 text-red-700 font-bold text-xs bg-red-100 w-fit px-4 py-1.5 rounded-lg border border-red-200 shadow-sm">
                                                                    <XCircle size={16} /> Salah
                                                                </span>
                                                            )}
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>

                                {completedFoods.length === FOODS.length && (
                                    <div className="bg-slate-50 p-8 flex flex-col items-center text-center border-t border-slate-200 animate-in slide-in-from-bottom-5">
                                        <div className="text-4xl mb-4">🎉</div>
                                        <h3 className="text-2xl font-black text-slate-800 mb-2">Seluruh Sampel Selesai Diuji!</h3>
                                        <p className="text-slate-600 font-medium mb-6 max-w-md">
                                            Silakan kirim laporan akhir hasil praktikum Anda ke sistem guru.
                                        </p>
                                        
                                        {!hasSubmittedCurrentSession ? (
                                            <button 
                                                onClick={handleFinishAndSend}
                                                disabled={isSending}
                                                className={`btn-3d flex items-center gap-3 px-10 py-5 bg-gradient-to-r from-emerald-500 to-teal-500 text-white rounded-2xl font-black shadow-[0_8px_0_#047857,0_15px_20px_rgba(0,0,0,0.15)] text-xl ${isSending ? 'opacity-70 cursor-wait' : ''}`}
                                            >
                                                {isSending ? (
                                                    <React.Fragment><RefreshCw className="animate-spin" size={28} /> Mengirim Data...</React.Fragment>
                                                ) : (
                                                    <React.Fragment><Send size={28} /> Kirim Laporan Sekarang</React.Fragment>
                                                )}
                                            </button>
                                        ) : (
                                            <div className="flex flex-col items-center animate-in fade-in zoom-in text-center w-full max-w-lg">
                                                <div className="flex flex-col items-center gap-3 text-emerald-800 font-bold bg-emerald-100 w-full px-8 py-8 rounded-3xl border-2 border-emerald-300 shadow-inner mb-4">
                                                    <div className="bg-white p-4 rounded-full shadow-md mb-2">
                                                        <CheckCircle size={48} className="text-emerald-500" />
                                                    </div>
                                                    <span className="text-2xl font-black">Laporan Berhasil Terkirim.</span>
                                                    <span className="text-xl text-emerald-600 font-extrabold animate-pulse">Tetap semangat! 💪</span>
                                                </div>
                                                
                                                {attemptCount < MAX_ATTEMPTS && (
                                                    <button onClick={resetAll} className="mt-4 text-sm font-bold text-slate-500 hover:text-indigo-600 hover:underline transition-colors flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-sm border border-slate-200">
                                                        <RotateCcw size={16} /> Ulangi Praktikum (Sisa Kuota: {MAX_ATTEMPTS - attemptCount}x)
                                                    </button>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    <footer className="relative z-10 text-center text-slate-400 text-[11px] pb-8">
                        <p>Laboratorium maya ini dikembangkan oleh Ruba Nurzaman | SMAN 1 Cipatat</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<VirtualFoodLab />);
    </script>
    
    <script>
        const observer = new MutationObserver((mutations) => {
            if (document.getElementById('root').innerHTML.trim().length > 0) {
                const loading = document.getElementById('loading');
                if(loading) loading.style.display = 'none';
                observer.disconnect();
            }
        });
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>
</body>
</html>
